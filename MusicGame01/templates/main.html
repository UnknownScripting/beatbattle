<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counterpoint</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chrome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body class="main-page">

    {% set hide_profile_link = true %}
    {% include '_chrome.html' %}

    <!-- top banner: profile on the left, title in the middle, settings on the right -->
    <header class="banner">
        <svg class="weave" viewBox="0 0 1200 170" preserveAspectRatio="none"
             aria-hidden="true" focusable="false">
            <path d="M-60 143.7 C-35.6 146 37.8 156.7 86.7 157.6 C135.6 158.4 184.4 151.7 233.3 148.8 C282.2 145.9 331.1 146.6 380 140.3 C428.9 134 477.8 123 526.7 110.9 C575.6 98.8 624.4 71.7 673.3 67.7 C722.2 63.7 771.1 76.5 820 86.9 C868.9 97.3 917.8 124.9 966.7 130.2 C1015.6 135.5 1064.4 126.4 1113.3 118.5 C1162.2 110.6 1235.6 88.7 1260 82.8" stroke="#d9403a"/>
            <path d="M-60 150.9 C-35.6 150.4 37.8 149.2 86.7 147.9 C135.6 146.7 184.4 145.6 233.3 143.1 C282.2 140.6 331.1 136.6 380 133 C428.9 129.4 477.8 123.6 526.7 121.6 C575.6 119.5 624.4 119.5 673.3 120.5 C722.2 121.4 771.1 134.5 820 127.3 C868.9 120.1 917.8 92.2 966.7 77.5 C1015.6 62.7 1064.4 44.6 1113.3 38.9 C1162.2 33.1 1235.6 42.3 1260 43" stroke="#e8c33a"/>
            <path d="M-60 136.7 C-35.6 137.7 37.8 141.3 86.7 142.7 C135.6 144.2 184.4 144.4 233.3 145.4 C282.2 146.3 331.1 150.3 380 148.3 C428.9 146.3 477.8 141.5 526.7 133.7 C575.6 125.8 624.4 114.7 673.3 101.4 C722.2 88.1 771.1 63.2 820 54 C868.9 44.8 917.8 40.9 966.7 46.2 C1015.6 51.4 1064.4 73.2 1113.3 85.5 C1162.2 97.7 1235.6 114 1260 119.8" stroke="#3576e4"/>
        </svg>

        <div class="banner-in">
            <a class="corner corner-profile" href="{{ url_for('profile') }}">
                <span class="mini-portrait" aria-hidden="true">{{ username[0]|upper }}</span>
                <span>Profile</span>
            </a>

            <div class="banner-mid">
                <p class="brand"><span class="brand-clef" aria-hidden="true">&#119070;</span>COUNTERPOINT</p>
                <h1 class="hello">Hello {{ username }}!</h1>
            </div>

            <a class="corner corner-settings" href="{{ url_for('settings') }}">
                <span>Settings</span>
                <span class="gear" aria-hidden="true">&#9881;&#xFE0E;</span>
            </a>
        </div>
    </header>

    <!-- the play area: famous pieces written out faintly behind the button -->
    <main class="stage">
        <svg id="score" class="score" aria-hidden="true"></svg>

        <a class="start" href="{{ url_for('waiting') }}">
            <span class="start-play" aria-hidden="true">&#9654;&#xFE0E;</span>
            Start game
        </a>
    </main>

    <script src="{{ url_for('static', filename='motifs.js') }}"></script>
</body>
</html>
